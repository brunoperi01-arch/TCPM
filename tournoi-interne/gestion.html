<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#040b1f">
<title>Tournoi interne TCPM — Aperçu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#040b1f; --deep:#071a45; --electric:#4fb3ff; --glow:#8fd3ff;
  --ball:#d9f03a; --text:#eaf1ff; --muted:#93a7cc; --line:rgba(143,211,255,.2);
  --glass:rgba(18,56,128,.42); --dim:rgba(8,22,56,.6);
  --green:#3ddc84; --orange:#ffb547; --red:#ff5d6c;
  --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --brush:'Permanent Marker',Impact,'Arial Black',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--night)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ball);outline-offset:2px}

/* Stade de nuit : projecteurs + court en perspective + balle floue */
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 8% 3%, rgba(255,255,255,.9) 0 2px, transparent 3px),
    radial-gradient(circle at 92% 6%, rgba(255,255,255,.9) 0 2px, transparent 3px),
    radial-gradient(ellipse 55% 22% at 8% 2%, rgba(79,179,255,.45), transparent 70%),
    radial-gradient(ellipse 55% 22% at 92% 5%, rgba(79,179,255,.35), transparent 70%),
    linear-gradient(180deg,#0c2660 0%,#071a45 30%,#050f2c 65%,#040b1f 100%)}
.wrap::before{content:"";position:absolute;left:-30%;right:-30%;bottom:-8%;height:60%;z-index:0;pointer-events:none;opacity:.5;
  background:
    linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.14)) 50% 0/2px 100% no-repeat,
    linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.14)) 0 40%/100% 2px no-repeat,
    linear-gradient(90deg,transparent 14%,rgba(255,255,255,.14) 14%,rgba(255,255,255,.14) calc(14% + 2px),transparent 0,transparent calc(86% - 2px),rgba(255,255,255,.14) 0,rgba(255,255,255,.14) 86%,transparent 0),
    linear-gradient(180deg,#0e3d96,#0a2a66);
  transform:perspective(420px) rotateX(58deg);transform-origin:bottom}
.ball{position:fixed;right:-70px;bottom:-60px;width:140px;height:140px;border-radius:50%;z-index:0;pointer-events:none;opacity:.45;filter:blur(5px);
  background:radial-gradient(circle at 35% 30%,#f5ff9c,#d2ea2e 55%,#93ad16)}
.wrap > *:not(.ball){position:relative;z-index:1}

.demo{background:rgba(217,240,58,.1);color:var(--ball);border-bottom:1px solid rgba(217,240,58,.25);font-size:12px;font-weight:600;text-align:center;padding:6px 10px}
.modes{display:flex;gap:6px;padding:10px 16px 0}
.modes button{flex:1;border:1px solid var(--line);background:var(--dim);color:var(--muted);border-radius:10px;padding:8px;font-size:13px;font-weight:600;cursor:pointer}
.modes button.on{background:var(--ball);color:var(--night);border-color:var(--ball)}

header.top{padding:18px 18px 20px;text-align:center}
.club{font-family:var(--cond);font-weight:600;letter-spacing:.38em;font-size:12px;text-transform:uppercase;color:var(--glow)}
h1{font-family:var(--brush);font-weight:400;text-transform:uppercase;line-height:.88;margin-top:12px;transform:rotate(-5deg)}
h1 span{display:block;-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .t1{font-size:54px;margin-right:34px;
  background-image:linear-gradient(175deg,#ffffff 0%,#dfe6f1 38%,#8392ad 50%,#eef2f8 62%,#b9c4d6 100%);
  filter:drop-shadow(0 0 10px rgba(79,179,255,.55))}
h1 .t2{font-size:58px;margin-left:40px;
  background-image:linear-gradient(175deg,#d6f0ff 0%,#5cc0ff 40%,#1f73ff 100%);
  filter:drop-shadow(0 0 14px rgba(47,125,255,.9))}
.swoosh{display:block;width:230px;height:18px;margin:2px auto 0;transform:rotate(-5deg)}
.progress{display:flex;gap:4px;margin-top:18px}
.progress i{flex:1;height:3px;border-radius:3px;background:rgba(143,211,255,.15)}
.progress i.on{background:var(--electric);box-shadow:0 0 8px var(--electric)}

main{flex:1;padding:8px 16px 28px}
.back{background:none;border:0;color:var(--glow);font-weight:600;font-size:15px;padding:2px 0 14px;cursor:pointer}
.q{font-family:var(--cond);font-size:28px;font-weight:700;line-height:1.05;color:#fff;text-transform:uppercase;letter-spacing:.02em}
.sub{color:var(--muted);font-size:14px;margin:4px 0 18px}

.big{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:17px 18px;margin-bottom:10px;font-size:17px;font-weight:600;color:#fff;cursor:pointer;text-align:left;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .08s,border-color .15s,box-shadow .15s}
.big:active:not(:disabled){transform:scale(.98)}
.big:hover:not(:disabled){border-color:var(--electric);box-shadow:0 0 18px rgba(79,179,255,.3)}
.big:disabled{cursor:not-allowed;background:var(--dim);color:#6f82a8}
.big small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:3px}
.big.letter{padding:14px 18px}
.big.letter .l{font-family:var(--brush);font-size:34px;color:var(--electric);width:40px;flex:none;text-shadow:0 0 12px rgba(79,179,255,.7)}
.big.letter:disabled .l{color:#3d5078;text-shadow:none}
.big .grow{flex:1}
.big .ref{color:#ff8f9a}
.chev{color:var(--electric);font-size:24px;line-height:1}

.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;flex:none}
.b-ok{background:rgba(61,220,132,.15);color:#6ff0a8}
.b-wait{background:rgba(255,181,71,.15);color:#ffc977}
.b-conf{background:rgba(79,179,255,.2);color:#a8dcff}
.b-full{background:rgba(255,93,108,.16);color:#ff8f9a}
.b-grey{background:rgba(147,167,204,.15);color:#b3c2dd}

.day{font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--glow);margin:20px 0 8px}
.day:first-of-type{margin-top:4px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 8px;cursor:pointer;text-align:center;color:#fff}
.slot:hover:not(:disabled){border-color:var(--ball);box-shadow:0 0 14px rgba(217,240,58,.25)}
.slot b{display:block;font-family:var(--cond);font-size:26px;font-weight:700}
.slot span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.slot:disabled{background:var(--dim);cursor:not-allowed}
.slot:disabled b{color:#4a5d85}
.slot.full span{color:var(--red);font-weight:700}
.slot.conflict span{color:var(--orange);font-weight:700}

.vs{background:linear-gradient(160deg,#1452c4 0%,#0b2a6e 55%,#071a45 100%);border:1px solid rgba(143,211,255,.35);border-radius:18px;overflow:hidden;box-shadow:0 0 34px rgba(47,125,255,.35)}
.vs .cat{background:rgba(0,0,0,.25);color:var(--glow);padding:10px 18px;font-size:13px;display:flex;justify-content:space-between}
.vs .side{padding:16px 18px;font-family:var(--cond);font-size:27px;font-weight:700;line-height:1.1;color:#fff}
.vs .side + .x + .side{text-align:right}
.vs .x{display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--ball);font-family:var(--brush);font-size:22px}
.vs .x::before,.vs .x::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(143,211,255,.5),transparent)}
.vs .when{display:flex;justify-content:space-between;align-items:flex-end;background:var(--ball);color:var(--night);padding:14px 18px;margin-top:6px}
.vs .when b{font-family:var(--cond);font-size:40px;font-weight:800;line-height:.9}
.vs .when span{font-weight:700;font-size:15px}

.cta{width:100%;background:var(--ball);color:var(--night);border:0;border-radius:14px;padding:18px;font-family:var(--cond);font-size:23px;font-weight:800;letter-spacing:.06em;margin-top:16px;cursor:pointer;box-shadow:0 0 26px rgba(217,240,58,.35)}
.cta.dark{background:transparent;color:#fff;border:1px solid var(--electric);box-shadow:0 0 18px rgba(79,179,255,.25)}
.cta.jat{display:block;text-align:center;text-decoration:none;font-size:17px;padding:14px;margin-top:10px}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.err{background:rgba(255,93,108,.14);color:#ffb3ba;border:1px solid rgba(255,93,108,.35);border-radius:12px;padding:12px 14px;margin-top:12px;font-weight:600;font-size:14px}
.info{background:rgba(79,179,255,.14);color:#d4ecff;border:1px solid rgba(79,179,255,.3);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-weight:600;font-size:14px}
.info .row{margin-top:10px}

.done{text-align:center;padding:4px 4px 0}
.done .check{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f5ff9c,#d2ea2e 60%,#a9c21c);color:var(--night);font-size:42px;font-weight:800;display:grid;place-items:center;margin:4px auto 16px;box-shadow:0 0 34px rgba(217,240,58,.5);animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.3) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.done .check{animation:none}}
.done h2{font-family:var(--brush);font-weight:400;font-size:28px;line-height:1.1;color:#fff;text-shadow:0 0 14px rgba(79,179,255,.6)}
.done p{color:var(--muted);margin:8px 0 18px}

.field{margin-top:18px}
.field label{display:block;font-weight:700;font-size:15px;margin-bottom:6px;color:#fff}
.field input{width:100%;font:inherit;font-size:18px;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(4,11,31,.7);color:#fff}
.field input::placeholder{color:#5a6d93}
.field input:focus{outline:none;border-color:var(--electric);box-shadow:0 0 14px rgba(79,179,255,.3)}
.field .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}

/* Admin */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--glass);border:1px solid var(--line);border-top:3px solid #5b6f96;border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--cond);font-size:36px;line-height:1;color:#fff}
.stat span{font-size:12px;color:var(--muted)}
.stat.s-wait{border-top-color:var(--orange)} .stat.s-conf{border-top-color:var(--green)}
.tabs{display:flex;background:var(--dim);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--electric);color:var(--night)}
.card{background:var(--glass);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:14px;padding:15px 16px;margin-bottom:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card.confirmed{border-left-color:var(--green)}
.card.refused,.card.cancelled{border-left-color:#5b6f96}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .players{font-weight:700;font-size:16px;line-height:1.3;color:#fff}
.card .players i{font-style:normal;font-weight:500;color:var(--muted);font-size:13px;display:block}
.card .pool{font-size:13px;color:var(--muted);margin-top:6px}
.card .when{font-weight:700;color:var(--glow);margin-top:4px}
.card .fill,.contact{font-size:12px;color:var(--muted);margin-top:4px}
.card .ask{font-weight:600;margin-top:12px;font-size:14px;color:#fff}
.reason{font-size:13px;color:#ff8f9a;margin-top:4px;font-weight:600}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:10px;padding:13px 8px;font-weight:700;font-size:14px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-ok{background:var(--ball);color:var(--night)}
.btn-no{background:transparent;color:#ff8f9a;border:1px solid rgba(255,93,108,.5)}
.btn-sec{background:rgba(143,211,255,.12);color:#fff}
.btn-wa{background:#25d366;color:#04210f}
.btn-wa.sent{background:rgba(37,211,102,.14);color:#6ff0a8}
.courts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.court{border:1px solid var(--line);background:var(--dim);color:#fff;border-radius:10px;padding:10px 4px;font-family:var(--cond);font-size:20px;font-weight:700;cursor:pointer;text-align:center}
.court small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:11px;color:var(--muted)}
.court.sel{border-color:var(--ball);background:rgba(217,240,58,.15);color:var(--ball);box-shadow:0 0 14px rgba(217,240,58,.25)}
.court:disabled{color:#3d5078;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--dim);color:#fff;border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.sel{border-color:var(--red);background:rgba(255,93,108,.16);color:#ffb3ba}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.reset{display:block;margin:6px auto 24px;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;position:relative;z-index:1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ===================== DONNÉES FICTIVES ===================== */
const POULES = {
  hommes: { label: "Hommes", groupes: {
    hautes: { label: "Poules hautes", poules: {
      A: ["Bruno Peri", "Julien Moreau", "Thomas Garcia", "Nicolas Blanc"],
      B: ["Antoine Roux", "Mathieu Fabre", "Olivier Girard", "Sébastien Mercier"],
      C: ["Laurent Faure", "David André", "Romain Chevalier", "Kévin Lambert"],
    }},
    basses: { label: "Poules basses", poules: {
      A: ["Pierre Bonnet", "Hugo François", "Lucas Martinez", "Alexandre Legrand", "Maxime Gauthier"],
      B: ["Yann Perrin", "Florian Robin", "Cédric Clément", "Damien Morin"],
    }},
  }},
  femmes: { label: "Femmes", poules: {
    A: ["Sophie Rossi", "Marie Martin", "Camille Durand", "Laura Petit"],
    B: ["Julie Leroy", "Emma Simon", "Chloé Michel", "Sarah Lefebvre"],
    C: ["Claire Garnier", "Pauline Rousseau", "Manon Vincent", "Léa Muller"],
  }},
  mixte: { label: "Double mixte", poules: {
    A: ["Bruno Peri / Sophie Rossi", "Julien Moreau / Marie Martin", "Antoine Roux / Camille Durand", "Pierre Bonnet / Julie Leroy"],
    B: ["Laurent Faure / Emma Simon", "Yann Perrin / Claire Garnier", "Mathieu Fabre / Chloé Michel"],
  }},
};

const CRENEAUX = [
  { date: "2026-09-16", time: "18:00", capacity: 2 },
  { date: "2026-09-16", time: "19:30", capacity: 3 },
  { date: "2026-09-16", time: "21:00", capacity: 4 },
  { date: "2026-09-17", time: "18:30", capacity: 2 },
  { date: "2026-09-17", time: "20:00", capacity: 4 },
  { date: "2026-09-19", time: "09:00", capacity: 6 },
  { date: "2026-09-19", time: "10:30", capacity: 6 },
  { date: "2026-09-19", time: "14:00", capacity: 4 },
  { date: "2026-09-20", time: "09:00", capacity: 6 },
  { date: "2026-09-20", time: "10:30", capacity: 6 },
  { date: "2026-09-23", time: "18:00", capacity: 2 },
  { date: "2026-09-23", time: "19:30", capacity: 3 },
  { date: "2026-09-26", time: "09:00", capacity: 6 },
  { date: "2026-09-26", time: "10:30", capacity: 6 },
];
const DEFAULT_CAPACITY = 6;
const TERRAINS = ["Terrain 1", "Terrain 2", "Terrain 3", "Terrain 4", "Terrain 5", "Terrain 6"];
const NOW = new Date("2026-09-15T12:00:00"); // date figée pour l'aperçu

// Demandes déjà présentes (simule la table Neon)
const SEED = [
  { category:"hommes", pool:"Poule Haute A", player:"Bruno Peri", opponent:"Thomas Garcia", date:"2026-09-16", time:"19:30", status:"confirmed", court:"Terrain 1", phone:"33612345678", notified:true },
  { category:"femmes", pool:"Poule Filles B", player:"Julie Leroy", opponent:"Emma Simon", date:"2026-09-16", time:"19:30", status:"confirmed", court:"Terrain 3", phone:"33623456789", notified:false },
  { category:"hommes", pool:"Poule Haute B", player:"Antoine Roux", opponent:"Mathieu Fabre", date:"2026-09-16", time:"18:00", status:"confirmed", court:"Terrain 2", phone:"33634567890", notified:true },
  { category:"femmes", pool:"Poule Filles A", player:"Sophie Rossi", opponent:"Marie Martin", date:"2026-09-16", time:"18:00", status:"confirmed", court:"Terrain 4", phone:"33745678901", notified:true },
  { category:"hommes", pool:"Poule Haute A", player:"Julien Moreau", opponent:"Nicolas Blanc", date:"2026-09-17", time:"20:00", status:"pending", court:null, phone:"33656789012" },
  { category:"hommes", pool:"Poule Haute B", player:"Olivier Girard", opponent:"Sébastien Mercier", date:"2026-09-19", time:"09:00", status:"pending", court:null, phone:"33667890123" },
  { category:"mixte", pool:"Poule Mixte A", player:"Antoine Roux / Camille Durand", opponent:"Pierre Bonnet / Julie Leroy", date:"2026-09-16", time:"21:00", status:"pending", court:null, phone:"33634567890" },
  { category:"hommes", pool:"Poule Basse A", player:"Hugo François", opponent:"Lucas Martinez", date:"2026-09-16", time:"19:30", status:"pending", court:null, phone:"33778901234" },
  { category:"hommes", pool:"Poule Haute C", player:"Laurent Faure", opponent:"David André", date:"2026-09-17", time:"18:30", status:"refused", court:null, phone:"33689012345", reason:"Créneau indisponible", notified:false },
];

const FORM_URL = "https://tcpm.vercel.app/tournoi-interne/"; // adresse de l'affiche
const JAT_PHONE = "33687726423"; // WhatsApp du juge-arbitre
const SIGNATURE = "Bruno Peri, juge-arbitre du tournoi";
const MOTIFS = ["Créneau indisponible", "Erreur de joueur", "Match déjà programmé", "Autre"];

/* ===================== LECTURE CONFIG ===================== */
const NOMS = {
  "hommes.hautes": l => `Poule Haute ${l}`,
  "hommes.basses": l => `Poule Basse ${l}`,
  femmes: l => `Poule Filles ${l}`,
  mixte: l => `Poule Mixte ${l}`,
};
const clean = s => s.replace(/\s+/g, " ").trim();
const LISTE_POULES = Object.entries(POULES).flatMap(([cat, def]) => {
  const blocs = def.groupes
    ? Object.entries(def.groupes).map(([g, gd]) => [`${cat}.${g}`, g, gd.poules])
    : [[cat, null, def.poules]];
  return blocs.flatMap(([cle, groupe, poules]) =>
    Object.entries(poules).map(([lettre, entrees]) => ({
      id: `${cle}.${lettre}`, categorie: cat, groupe, lettre,
      nom: NOMS[cle](lettre), entrees: entrees.map(clean),
    })));
});
const getPoule = id => LISTE_POULES.find(p => p.id === id);
const joueursDe = e => e.split("/").map(clean);

/* ===================== LOGIQUE (côté serveur dans la vraie app) ===================== */
let uid = 0;
const clone = () => SEED.map(r => ({ ...r, id: "r" + (++uid) }));
let requests = clone();

const isActive = r => r.status === "pending" || r.status === "confirmed";
const pair = (a, b) => [a, b].sort().join("|");
const capOf = (d, t) => (CRENEAUX.find(c => c.date === d && c.time === t) || {}).capacity || DEFAULT_CAPACITY;
const confirmedOn = (d, t) => requests.filter(r => r.status === "confirmed" && r.date === d && r.time === t);
const findMatch = (cat, pool, a, b) =>
  requests.find(r => isActive(r) && r.category === cat && r.pool === pool && pair(r.player, r.opponent) === pair(a, b));
const busyOn = (d, t) => new Set(requests.filter(r => isActive(r) && r.date === d && r.time === t)
  .flatMap(r => [...joueursDe(r.player), ...joueursDe(r.opponent)]));

// Dernière demande close (refusée/annulée) d'un match, pour l'afficher au joueur
const lastClosed = (cat, pool, a, b) =>
  requests.filter(r => !isActive(r) && r.category === cat && r.pool === pool && pair(r.player, r.opponent) === pair(a, b)).pop();

// Téléphone : on accepte 06…, 07…, +33…, avec ou sans espaces → "336XXXXXXXX"
function normPhone(raw) {
  let d = String(raw || "").replace(/\D/g, "");
  if (d.startsWith("0033")) d = d.slice(2);
  if (d.startsWith("0")) d = "33" + d.slice(1);
  return /^33[67]\d{8}$/.test(d) ? d : null;
}
const fmtPhone = p => ("0" + p.slice(2)).replace(/(\d{2})(?=\d)/g, "$1 ");

function waMessage(r) {
  return waBody(r) + `\n\n${SIGNATURE}`;
}
function waBody(r) {
  const quand = `${fmtDay(r.date).toLowerCase()} à ${fmtTime(r.time)}`;
  const match = `${r.player} contre ${r.opponent}`;
  if (r.status === "confirmed")
    return `✅ Tournoi interne TCPM\n${match}\nMatch confirmé ${quand}, ${r.court}.\nPensez à prévenir votre adversaire. Bon match ! 🎾`;
  if (r.status === "refused")
    return `❌ Tournoi interne TCPM\nVotre demande ${match} du ${quand} n'a pas pu être acceptée${r.reason ? ` (${r.reason.toLowerCase()})` : ""}.\nRefaites une demande sur un autre créneau : ${FORM_URL}`;
  return `⚠️ Tournoi interne TCPM\nLe match ${match} du ${quand} est annulé.\nRefaites une demande sur un autre créneau : ${FORM_URL}`;
}
const waLink = r => `https://wa.me/${r.phone}?text=${encodeURIComponent(waMessage(r))}`;
const waButton = r => `<button class="btn btn-wa ${r.notified ? "sent" : ""}" ${btnData("wa", r.id)}>${r.notified ? "✓ Prévenu (renvoyer)" : "Prévenir sur WhatsApp"}</button>`;

function slotState(c, a, b) {
  const left = (c.capacity || DEFAULT_CAPACITY) - confirmedOn(c.date, c.time).length;
  if (left <= 0) return { type: "full" };
  const busy = busyOn(c.date, c.time);
  if ([...joueursDe(a), ...joueursDe(b)].some(n => busy.has(n))) return { type: "conflict" };
  return { type: "ok", left };
}

/* ===================== FORMATAGE ===================== */
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const d12 = d => new Date(d + "T12:00:00");
const fmtDay = d => cap1(d12(d).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }));
const fmtShort = d => d12(d).toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit" });
const fmtTime = t => t.replace(":", "h");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const btnData = (act, v = "") => `data-act="${act}" data-v="${esc(v)}"`;

/* ===================== ÉTAT ===================== */
const fresh = () => ({ step: "cat", hist: [], cat: null, groupe: null, poule: null, player: null, opp: null, slot: null, err: null, last: null, phone: "" });
const adminFresh = () => ({ tab: "pending", val: null, court: null, refuse: null, refReason: null, cancel: null, msg: null, msgId: null });
let S = { mode: "joueur", ...fresh(), ...adminFresh() };

function go(step) { S.hist.push(S.step); S.step = step; S.err = null; render(); window.scrollTo(0, 0); }
function back() { S.step = S.hist.pop() || "cat"; S.err = null; render(); }
const flow = () => ["cat", ...(S.cat === "hommes" ? ["groupe"] : []), "poule", "player", "opp", "slot", "recap"];

/* ===================== VUES JOUEUR ===================== */
function vCat() {
  return `<p class="q">Choisissez votre catégorie</p><p class="sub">Tournoi interne 2026</p>` +
    Object.entries(POULES).map(([k, d]) => {
      const info = d.groupes ? "Poules hautes et poules basses" : `${Object.keys(d.poules).length} poules`;
      return `<button class="big" ${btnData("cat", k)}><span>${d.label}<small>${info}</small></span><span class="chev">›</span></button>`;
    }).join("");
}
function vGroupe() {
  const g = POULES.hommes.groupes;
  return `<p class="q">Choisissez votre niveau</p><p class="sub">Hommes</p>` +
    Object.entries(g).map(([k, d]) =>
      `<button class="big" ${btnData("groupe", k)}><span>${d.label}<small>Poules ${Object.keys(d.poules).join(", ")}</small></span><span class="chev">›</span></button>`
    ).join("");
}
function vPoule() {
  const list = LISTE_POULES.filter(p => p.categorie === S.cat && (S.cat !== "hommes" || p.groupe === S.groupe));
  const titre = S.cat === "hommes" ? `Hommes, ${POULES.hommes.groupes[S.groupe].label.toLowerCase()}` : POULES[S.cat].label;
  const unite = S.cat === "mixte" ? "équipes" : "joueurs";
  return `<p class="q">Choisissez votre poule</p><p class="sub">${titre}</p>` +
    list.map(p => {
      const open = p.entrees.length >= 2;
      return `<button class="big letter" ${open ? "" : "disabled"} ${btnData("poule", p.id)}>
        <span class="l">${p.lettre}</span>
        <span class="grow">${p.nom}<small>${open ? `${p.entrees.length} ${unite}` : "Composition à venir"}</small></span>
        ${open ? '<span class="chev">›</span>' : ""}</button>`;
    }).join("");
}
function vPlayer() {
  const p = getPoule(S.poule);
  return `<p class="q">${S.cat === "mixte" ? "Quelle est votre équipe ?" : "Qui êtes-vous ?"}</p><p class="sub">${p.nom}</p>` +
    p.entrees.map(e => `<button class="big" ${btnData("player", e)}><span>${esc(e)}</span><span class="chev">›</span></button>`).join("");
}
function vOpp() {
  const p = getPoule(S.poule);
  let dispo = 0;
  const rows = p.entrees.filter(e => e !== S.player).map(e => {
    const r = findMatch(S.cat, p.nom, S.player, e);
    let badge, small = "", dis = true;
    if (r && r.status === "confirmed") { badge = `<span class="badge b-conf">Programmé</span>`; small = `${fmtShort(r.date)} à ${fmtTime(r.time)}, ${r.court}`; }
    else if (r) { badge = `<span class="badge b-wait">Demande en attente</span>`; small = `${fmtShort(r.date)} à ${fmtTime(r.time)}`; }
    else {
      dis = false; dispo++;
      const c = lastClosed(S.cat, p.nom, S.player, e);
      if (c && c.status === "refused") {
        badge = `<span class="badge b-full">Refusée</span>`;
        small = `<span class="ref">${fmtShort(c.date)} à ${fmtTime(c.time)} : ${esc(c.reason || "refusée par le club")}</span><br>Touchez pour refaire une demande`;
      } else if (c && c.status === "cancelled") {
        badge = `<span class="badge b-grey">Annulé</span>`;
        small = `Match du ${fmtShort(c.date)} annulé. Touchez pour refaire une demande`;
      } else badge = `<span class="badge b-ok">Disponible</span>`;
    }
    return `<button class="big" ${dis ? "disabled" : ""} ${btnData("opp", e)}><span class="grow">${esc(e)}${small ? `<small>${small}</small>` : ""}</span>${badge}</button>`;
  }).join("");
  return `<p class="q">Votre adversaire</p><p class="sub">${esc(S.player)}, ${p.nom}</p>` +
    (dispo ? "" : `<div class="info">Tous vos matchs sont déjà demandés ou programmés.</div>`) + rows;
}
function vSlot() {
  const future = CRENEAUX.map((c, i) => ({ ...c, i })).filter(c => new Date(`${c.date}T${c.time}:00`) > NOW);
  const byDay = {};
  future.forEach(c => (byDay[c.date] = byDay[c.date] || []).push(c));
  const html = Object.entries(byDay).map(([d, list]) =>
    `<p class="day">${fmtDay(d)}</p><div class="slots">` +
    list.map(c => {
      const st = slotState(c, S.player, S.opp);
      const lbl = st.type === "full" ? "Complet" : st.type === "conflict" ? "Déjà engagé" : `${st.left} terrain${st.left > 1 ? "s" : ""}`;
      return `<button class="slot ${st.type}" ${st.type !== "ok" ? "disabled" : ""} ${btnData("slot", c.i)}><b>${fmtTime(c.time)}</b><span>${lbl}</span></button>`;
    }).join("") + `</div>`
  ).join("");
  return `<p class="q">Choisissez un créneau</p><p class="sub">${esc(S.player)} contre ${esc(S.opp)}</p>` +
    (html || `<div class="empty">Aucun créneau ouvert pour le moment. Revenez bientôt.</div>`) +
    `<p class="note">« Déjà engagé » : un des joueurs a déjà un match sur ce créneau.</p>`;
}
function matchCard(cat, poolNom, a, b, date, time, extra = "") {
  return `<div class="vs">
    <div class="cat"><span>${POULES[cat].label}</span><span>${poolNom}</span></div>
    <div class="side">${esc(a)}</div><div class="x">VS</div><div class="side">${esc(b)}</div>
    <div class="when"><span>${fmtDay(date)}${extra}</span><b>${fmtTime(time)}</b></div></div>`;
}
function vRecap() {
  const p = getPoule(S.poule), c = CRENEAUX[S.slot];
  return `<p class="q">Vérifiez votre demande</p><p class="sub">Le terrain sera attribué par le club.</p>` +
    matchCard(S.cat, p.nom, S.player, S.opp, c.date, c.time) +
    `<div class="field"><label for="phone">Votre numéro de portable</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="06 12 34 56 78" value="${esc(S.phone)}">
      <p class="hint">Le club vous prévient sur WhatsApp quand le créneau est confirmé ou refusé. Numéro supprimé à la fin du tournoi.</p></div>` +
    (S.err ? `<div class="err">${S.err}</div>` : "") +
    `<button class="cta" ${btnData("send")}>ENVOYER LA DEMANDE</button>`;
}
function vDone() {
  const r = S.last;
  return `<div class="done"><div class="check">✓</div>
    <h2>Demande envoyée au club</h2><p>Votre créneau doit maintenant être confirmé. Le club vous prévient sur WhatsApp au ${fmtPhone(r.phone)}.</p></div>` +
    matchCard(r.category, r.pool, r.player, r.opponent, r.date, r.time) +
    `<button class="cta dark" ${btnData("again")}>Faire une autre demande</button>
     <a class="cta dark jat" href="https://wa.me/${JAT_PHONE}" target="_blank" rel="noopener">Une question ? Écrire au juge-arbitre</a>
     <p class="note">Aperçu : ouvrez l’onglet Admin pour valider cette demande.</p>`;
}

function submit() {
  const p = getPoule(S.poule), c = CRENEAUX[S.slot];
  S.phone = document.getElementById("phone").value;
  const phone = normPhone(S.phone);
  if (!phone) { S.err = "Indiquez un numéro de portable valide (06 ou 07)."; return render(); }
  if (findMatch(S.cat, p.nom, S.player, S.opp)) { S.err = "Une demande existe déjà pour ce match."; return render(); }
  const st = slotState(c, S.player, S.opp);
  if (st.type === "full") { S.err = "Ce créneau est complet. Revenez en arrière pour en choisir un autre."; return render(); }
  if (st.type === "conflict") { S.err = "Un des joueurs a déjà un match sur ce créneau. Choisissez-en un autre."; return render(); }
  const r = { id: "r" + (++uid), category: S.cat, pool: p.nom, player: S.player, opponent: S.opp, date: c.date, time: c.time, status: "pending", court: null, phone, notified: false };
  requests.push(r);
  S.last = r; S.hist = []; S.step = "done"; S.err = null; render(); window.scrollTo(0, 0);
}

/* ===================== VUE ADMIN ===================== */
function vAdmin() {
  const by = s => requests.filter(r => s.includes(r.status));
  const pend = by(["pending"]), conf = by(["confirmed"]), other = by(["refused", "cancelled"]);
  const aPrevenir = [...conf, ...other].filter(r => !r.notified).length;
  const list = { pending: pend, confirmed: conf, other }[S.tab]
    .slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const empty = { pending: "Aucune demande en attente.", confirmed: "Aucun match confirmé.", other: "Aucune demande refusée ou annulée." }[S.tab];
  return `
    <div class="stats">
      <div class="stat s-wait"><b>${pend.length}</b><span>à valider</span></div>
      <div class="stat s-conf"><b>${conf.length}</b><span>confirmés</span></div>
      <div class="stat"><b>${other.length}</b><span>refusés / annulés</span></div>
    </div>
    <div class="tabs">
      <button class="${S.tab === "pending" ? "on" : ""}" ${btnData("tab", "pending")}>En attente</button>
      <button class="${S.tab === "confirmed" ? "on" : ""}" ${btnData("tab", "confirmed")}>Confirmés</button>
      <button class="${S.tab === "other" ? "on" : ""}" ${btnData("tab", "other")}>Refusés</button>
    </div>
    ${aPrevenir ? `<div class="info">📱 ${aPrevenir} joueur${aPrevenir > 1 ? "s" : ""} à prévenir sur WhatsApp</div>` : ""}
    ${S.msg ? `<div class="info">${S.msg}${S.msgId ? `<div class="row">${waButton(requests.find(x => x.id === S.msgId))}</div>` : ""}</div>` : ""}
    ${list.length ? list.map(card).join("") : `<div class="empty">${empty}</div>`}`;
}
function card(r) {
  const cap = capOf(r.date, r.time), used = confirmedOn(r.date, r.time);
  const head = `<div class="top"><div class="players">${esc(r.player)}<i>contre</i>${esc(r.opponent)}</div>
      ${r.status === "confirmed" ? `<span class="badge b-conf">${r.court}</span>` : ""}
      ${r.status === "refused" ? `<span class="badge b-full">Refusé</span>` : ""}
      ${r.status === "cancelled" ? `<span class="badge b-grey">Annulé</span>` : ""}</div>
    <div class="pool">${POULES[r.category].label}, ${r.pool}</div>
    <div class="when">${fmtDay(r.date)} à ${fmtTime(r.time)}</div>
    <div class="contact">Demandé par ${esc(r.player)}, ${fmtPhone(r.phone)}</div>
    ${r.status === "refused" && r.reason ? `<div class="reason">Motif : ${esc(r.reason)}</div>` : ""}`;
  let body = "";
  if (r.status === "pending") {
    body = `<div class="fill">Créneau : ${used.length} / ${cap} matchs confirmés</div>`;
    if (S.val === r.id) {
      if (used.length >= cap) {
        body += `<div class="err">Créneau complet. Refusez la demande ou attendez une annulation.</div>
          <div class="row"><button class="btn btn-sec" ${btnData("valX")}>Retour</button></div>`;
      } else {
        const taken = used.map(x => x.court);
        body += `<p class="ask">Choisissez le terrain</p><div class="courts">` +
          TERRAINS.map(t => {
            const pris = taken.includes(t);
            return `<button class="court ${S.court === t ? "sel" : ""}" ${pris ? "disabled" : ""} ${btnData("court", t)}>${t.replace("Terrain ", "T")}<small>${pris ? "pris" : "libre"}</small></button>`;
          }).join("") + `</div>
          <div class="row"><button class="btn btn-sec" ${btnData("valX")}>Retour</button>
          <button class="btn btn-ok" ${S.court ? "" : "disabled"} ${btnData("valOk", r.id)}>CONFIRMER</button></div>`;
      }
    } else if (S.refuse === r.id) {
      body += `<p class="ask">Motif du refus (facultatif)</p><div class="chips">` +
        MOTIFS.map(m => `<button class="chip ${S.refReason === m ? "sel" : ""}" ${btnData("reason", m)}>${m}</button>`).join("") +
        `</div><div class="row"><button class="btn btn-sec" ${btnData("refX")}>Retour</button>
        <button class="btn btn-no" ${btnData("refOk", r.id)}>REFUSER</button></div>`;
    } else {
      body += `<div class="row"><button class="btn btn-no" ${btnData("ref", r.id)}>REFUSER</button>
        <button class="btn btn-ok" ${btnData("val", r.id)}>VALIDER</button></div>`;
    }
  } else if (r.status === "confirmed") {
    body = S.cancel === r.id
      ? `<p class="ask">Annuler ce match ? ${r.court} sera libéré.</p>
         <div class="row"><button class="btn btn-sec" ${btnData("canX")}>Retour</button>
         <button class="btn btn-no" ${btnData("canOk", r.id)}>Oui, annuler</button></div>`
      : `<div class="row"><button class="btn btn-sec" ${btnData("can", r.id)}>Annuler le match</button>${waButton(r)}</div>`;
  } else {
    body = `<div class="row">${waButton(r)}</div>`;
  }
  return `<div class="card ${r.status}">${head}${body}</div>`;
}
function confirmReq(id) {
  const r = requests.find(x => x.id === id);
  // Re-vérifications (dans la vraie app : transaction Neon + index uniques)
  if (!r || r.status !== "pending") { S.msg = "Cette demande a déjà été traitée."; return; }
  const used = confirmedOn(r.date, r.time);
  if (used.length >= capOf(r.date, r.time)) { S.msg = "Créneau complet : validation impossible."; return; }
  if (used.some(x => x.court === S.court)) { S.msg = `${S.court} est déjà pris sur ce créneau.`; return; }
  r.status = "confirmed"; r.court = S.court; r.notified = false;
  S.msg = `✅ Match confirmé : ${esc(r.player)} contre ${esc(r.opponent)}, ${r.court}.`;
  S.msgId = r.id;
  S.val = null; S.court = null;
}

/* ===================== RENDU ===================== */
function render() {
  const admin = S.mode === "admin";
  let body, progress = "";
  if (admin) body = vAdmin();
  else {
    const views = { cat: vCat, groupe: vGroupe, poule: vPoule, player: vPlayer, opp: vOpp, slot: vSlot, recap: vRecap, done: vDone };
    body = (S.hist.length && S.step !== "done" ? `<button class="back" ${btnData("back")}>‹ Retour</button>` : "") + views[S.step]();
    const f = flow(), idx = S.step === "done" ? f.length : f.indexOf(S.step);
    progress = `<div class="progress">${f.map((_, i) => `<i class="${i <= idx ? "on" : ""}"></i>`).join("")}</div>`;
  }
  document.getElementById("app").innerHTML = `
    <div class="demo">Aperçu avec données fictives, rien n'est enregistré</div>
    <div class="modes">
      <button class="${!admin ? "on" : ""}" ${btnData("mode", "joueur")}>Joueur</button>
      <button class="${admin ? "on" : ""}" ${btnData("mode", "admin")}>Admin</button>
    </div>
    <header class="top">
      <div class="club">${admin ? "Administration" : "TC Pennes-Mirabeau"}</div>
      <h1><span class="t1">Tournoi</span><span class="t2">Interne</span></h1>
      <svg class="swoosh" viewBox="0 0 230 18" aria-hidden="true"><defs><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#4fb3ff" stop-opacity="0"/><stop offset=".35" stop-color="#4fb3ff"/><stop offset="1" stop-color="#bfe6ff" stop-opacity=".2"/></linearGradient></defs><path d="M4 14 C60 9 140 5 226 3 L224 7 C150 8 80 12 6 16 Z" fill="url(#sw)"/></svg>
      ${progress}
    </header>
    <main>${body}</main>
    <button class="reset" ${btnData("reset")}>Réinitialiser la démo</button>
    <div class="ball" aria-hidden="true"></div>`;
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const v = el.dataset.v, act = el.dataset.act;
  if (act === "wa") {
    e.preventDefault();
    const r = requests.find(x => x.id === v);
    if (r) { window.open(waLink(r), "_blank", "noopener"); r.notified = true; }
    return render();
  }
  if (S.mode === "admin" && !["court", "reason"].includes(act)) { S.msg = null; S.msgId = null; }
  switch (act) {
    case "mode": S.mode = v; break;
    case "cat": S.cat = v; return go(v === "hommes" ? "groupe" : "poule");
    case "groupe": S.groupe = v; return go("poule");
    case "poule": S.poule = v; return go("player");
    case "player": S.player = v; return go("opp");
    case "opp": S.opp = v; return go("slot");
    case "slot": S.slot = Number(v); return go("recap");
    case "back": return back();
    case "send": return submit();
    case "again": Object.assign(S, fresh()); break;
    case "tab": S.tab = v; S.val = S.refuse = S.cancel = null; break;
    case "val": S.val = v; S.court = null; S.refuse = S.cancel = null; break;
    case "valX": S.val = null; S.court = null; break;
    case "court": S.court = v; break;
    case "valOk": confirmReq(v); break;
    case "ref": S.refuse = v; S.refReason = null; S.val = S.cancel = null; break;
    case "refX": S.refuse = null; S.refReason = null; break;
    case "reason": S.refReason = S.refReason === v ? null : v; break;
    case "refOk": {
      const r = requests.find(x => x.id === v);
      if (r && r.status === "pending") {
        r.status = "refused"; r.reason = S.refReason; r.notified = false;
        S.msg = `❌ Demande refusée : ${esc(r.player)} contre ${esc(r.opponent)}.`; S.msgId = r.id;
      }
      S.refuse = null; S.refReason = null; break;
    }
    case "can": S.cancel = v; break;
    case "canX": S.cancel = null; break;
    case "canOk": {
      const r = requests.find(x => x.id === v);
      if (r && r.status === "confirmed") {
        S.msg = `⚠️ Match annulé, ${r.court} libéré.`; S.msgId = r.id;
        r.status = "cancelled"; r.notified = false;
      }
      S.cancel = null; break;
    }
    case "reset": requests = clone(); S = { mode: S.mode, ...fresh(), ...adminFresh() }; break;
  }
  render();
});

render();
</script>
</body>
</html>
